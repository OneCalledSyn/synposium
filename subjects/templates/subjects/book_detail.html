<!DOCTYPE html>
<html>
<head>
    <title>{{ book.title }}</title>
</head>
<body>
    <h1>{{ book.title }}</h1>
    <p>Author: {{ book.author }}</p>
    <p>ISBN: {{ book.isbn }}</p>
    <h2>Chapters</h2>
    <ul>
        {% for chapter in chapters %}
            <li><a href="{% url 'chapter_notes' chapter.id %}">Chapter {{ chapter.number }}: {{ chapter.title }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
